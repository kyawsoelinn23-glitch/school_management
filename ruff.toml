target-version = "py312"

[lint]
preview = true
external = ["OLS"]

select = [
    "BLE",
    "C",
    "COM",
    "E",
    "EM",
    "EXE",
    "F",
    "FA",
    "FLY",
    "G",
    "I",
    "ICN",
    "INT",
    "ISC",
    "LOG",
    "PGH",
    "PIE",
    "PLC",
    "PLE",
    "PLW",
    "PYI",
    "RET",
    "RUF",
    "SIM",
    "SLOT",
    "T",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]

ignore = [
    "E501",
    "PLC0414",
]

[lint.per-file-ignores]
"**/__init__.py" = [
    "F401",
]

[lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

known-first-party = ["odoo"]
known-local-folder = ["odoo.addons"]
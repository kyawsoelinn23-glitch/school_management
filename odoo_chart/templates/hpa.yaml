#Auto Scaling =>> CPU 90% above pod3, pod4
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: odoo-hpa

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: odoo

  minReplicas: 2
  maxReplicas: 10

  metrics:
  - type: Resource

    resource:
      name: cpu

      target:
        type: Utilization
        averageUtilization: 90

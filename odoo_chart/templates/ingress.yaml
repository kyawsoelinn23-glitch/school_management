#Odoo Pods
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: odoo-ingress

spec:
  ingressClassName: traefik

  rules:
{{/*    - host: erp.kyawsoelinn.com*/}}
    - http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: odoo-service
                port:
                  number: 80
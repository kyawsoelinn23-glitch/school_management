#Odoo Pods
apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:
  name: odoo-ingress

spec:
  ingressClassName: traefik  # SSL/TLS =>> HTTP/HTTPS

  rules:
    - host: kyawsoelinn.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: odoo-service
                port:
                  number: 80
# Odoo Deployment
# Odoo Pods
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.appName }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{ .Values.appName }}

  template:
    metadata:
      labels:
        app: {{ .Values.appName }}

    spec:
      containers:

      - name: {{ .Values.appName }}

        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

        ports:
        - containerPort: 8069

        env:
        - name: HOST
          value: "{{ .Values.postgresql.host }}"

        - name: USER
          value: "{{ .Values.postgresql.user }}"

        - name: PASSWORD
          valueFrom:
            secretKeyRef:
              name: odoo-secret
              key: db-password

        volumeMounts:
        - name: odoo-data
          mountPath: /var/lib/odoo

        - name: odoo-config
          mountPath: /etc/odoo/odoo.conf
          subPath: odoo.conf

      volumes:
      - name: odoo-data
        persistentVolumeClaim:
          claimName: odoo-pvc

      - name: odoo-config
        configMap:
          name: odoo-config

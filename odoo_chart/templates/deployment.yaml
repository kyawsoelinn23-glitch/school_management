# Odoo Deployment
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.appName }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{ .Values.appName }}

  template:
    metadata:
      labels:
        app: {{ .Values.appName }}

    spec:
      containers:
      - name: {{ .Values.appName }}

        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

        args:
          - server
          - --db_host={{ .Values.postgresql.host }}
          - --db_port=5432
          - --db_user={{ .Values.postgresql.user }}
          - --db_password={{ .Values.postgresql.password }}

        ports:
        - containerPort: 8069

        volumeMounts:
        - name: odoo-data
          mountPath: /var/lib/odoo

      volumes:
      - name: odoo-data
        persistentVolumeClaim:
          claimName: odoo-pvc

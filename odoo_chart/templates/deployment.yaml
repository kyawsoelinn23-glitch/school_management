# Odoo Deployment
# Odoo Pods
apiVersion: apps/v1
kind: Deployment

metadata:
  name: odoo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: odoo

  template:
    metadata:
      labels:
        app: odoo

    spec:
      containers:
      - name: odoo

        image: odoo:19

        ports:
        - containerPort: 8069

        volumeMounts:
        - name: odoo-data
          mountPath: /var/lib/odoo

        - name: odoo-config
          mountPath: /etc/odoo/odoo.conf
          subPath: odoo.conf

      volumes:

      - name: odoo-data
        persistentVolumeClaim:
          claimName: odoo-pvc

      - name: odoo-config
        configMap:
          name: odoo-config
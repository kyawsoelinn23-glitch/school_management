# Odoo Deployment
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.appName }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{ .Values.appName }}

  template:
    metadata:
      labels:
        app: {{ .Values.appName }}

    spec:
      containers:
      - name: {{ .Values.appName }}

        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

        env:
          - name: HOST
            value: postgres-service

          - name: USER
            value: odoo

          - name: PASSWORD
            valueFrom:
              secretKeyRef:
                name: odoo-secret
                key: db-password

        ports:
        - containerPort: 8069

        volumeMounts:
        - name: odoo-data
          mountPath: /var/lib/odoo

      volumes:
      - name: odoo-data
        persistentVolumeClaim:
          claimName: odoo-pvc

name: Pull Request Checks

on:
  pull_request:
    branches:
      - DEV
      - STG
      - UAT
      - PROD

permissions:
  contents: read

jobs:
  branch-policy:
    uses: ./.github/workflows/branch-policy.yml
    with:
      source_branch: ${{ github.head_ref }}
      target_branch: ${{ github.base_ref }}

  ruff:
    name: Ruff Check
    needs: branch-policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.15.0"

      - name: Show Ruff Version
        run: ruff --version

      - name: Ruff Lint Check
        run: ruff check .

      - name: Ruff Format Check
        run: ruff format --check .

  manifest:
    name: Manifest Validation
    needs: ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Verify Odoo Manifest Files
        run: |
          MANIFESTS=$(find . -name "__manifest__.py")

          if [ -z "$MANIFESTS" ]; then
            echo "::error::No __manifest__.py file found"
            exit 1
          fi

          echo "$MANIFESTS"

  test:
    name: Odoo Test Stage
    needs: manifest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Run Tests
        run: |
          echo "Odoo test stage"